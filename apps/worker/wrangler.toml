name = "memecoin-analysis-engine"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Serves the built frontend (apps/web/dist) directly from this Worker.
# Run `pnpm --filter web build` before `wrangler deploy` / `wrangler dev`.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Create with: wrangler d1 create memecoin-analysis-engine
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "memecoin-analysis-engine"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
