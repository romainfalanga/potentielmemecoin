name = "memecoin-analysis-engine"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Serves the built frontend (apps/web/dist) directly from this Worker.
# Run `pnpm --filter web build` before `wrangler deploy` / `wrangler dev`.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "memecoin-analysis-engine"
database_id = "fc765c01-274a-483d-8b14-0ca802295690"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
